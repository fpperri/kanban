name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: npm test
      - if: ${{ !cancelled() }}
        run: node test/web/docs-pinned-check.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KANBAN_BROWSER_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run test:browser -- --shots browser-shots
      - run: npm run test:browser -- --reverse --shots browser-shots-reverse
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: older
      - run: npm run test:browser -- --only smoke --plugin older --shots browser-shots-older
      - run: node test/web/browser/fault-check.js
      - if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-screenshots
          path: |
            browser-shots
            browser-shots-reverse
            browser-shots-older
          if-no-files-found: ignore
