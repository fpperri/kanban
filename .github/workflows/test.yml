name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KANBAN_BROWSER_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:browser -- --shots browser-shots
      - run: npm run test:browser -- --reverse --shots browser-shots-reverse
      - uses: actions/checkout@v4
        with:
          ref: main
          path: older
      - run: npm run test:browser -- --only smoke --plugin older --shots browser-shots-older
      - run: node skills/web/test/browser/fault-check.js
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: |
            browser-shots
            browser-shots-reverse
            browser-shots-older
          if-no-files-found: ignore
